<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#25446f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="プラコロHP"><link rel="apple-touch-icon" href="./icon.svg"><link rel="manifest" href="./manifest.webmanifest"><title>プラコロ HPカウンター</title><style>
:root{--bg1:#25446f;--bg2:#dfe7f2;--line:#d7dfea;--text:#0f172a;--muted:#5f6f85;--red:#ef4444;--blue:#3b82f6;--green2:#16a34a;--shadow:0 10px 28px rgba(28,54,92,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,var(--bg1),#5f82ae 15%,var(--bg2) 32%,#eef3f9 100%);color:var(--text)}
body{min-height:100dvh;padding:env(safe-area-inset-top) 10px calc(env(safe-area-inset-bottom) + 10px);overflow:hidden}
.app{height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 20px);max-width:720px;margin:0 auto;display:grid;grid-template-rows:1.32fr auto 1.32fr;gap:7px}
.player{border-radius:30px;overflow:hidden;border:2px solid rgba(255,255,255,.72);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;padding:18px 16px 16px;position:relative;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
.player.top{transform:rotate(180deg);background:linear-gradient(180deg,#ffeaea,#ffd6d6)}
.player.bottom{background:linear-gradient(180deg,#edf5ff,#dcecff)}
.player.selected{border-width:2px;border-color:rgba(255,255,255,.72);box-shadow:0 0 0 6px #111827,0 12px 28px rgba(17,24,39,.18)}
.player.selected::after{content:"SELECTED";position:absolute;top:12px;right:14px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.08em;color:#fff;background:linear-gradient(180deg,#1f2937,#111827);z-index:4;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.name{text-align:center;font-size:16px;font-weight:900;margin-bottom:2px}.player.top .name{color:#a22929}.player.bottom .name{color:#1f56b7}
.hpWrap{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:14px;margin:6px 0 12px}.hpLabel{font-size:24px;font-weight:900}.hpMain{font-size:clamp(82px,16vh,136px);font-weight:900;line-height:.9;text-align:center;font-variant-numeric:tabular-nums}.hpSub{font-size:24px;font-weight:800;opacity:.82}
.bar{height:18px;background:rgba(255,255,255,.82);border-radius:999px;padding:2px}.fill{height:100%;width:100%;border-radius:999px;transition:.18s}.status{margin-top:10px;text-align:center;font-size:14px;font-weight:700;color:var(--muted)}.ko{color:#b91c1c}
.center{background:rgba(255,255,255,.96);border:1px solid rgba(213,224,237,.9);border-radius:22px;box-shadow:var(--shadow);padding:7px 10px}.currentSel{text-align:center;color:#28415f;font-size:14px;font-weight:900;margin:0 0 6px}
.quickRow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:0 0 7px}.quickBtn{border:1px solid #cbd5e1;border-radius:14px;background:linear-gradient(180deg,#334155,#1f2937);color:#fff;font-size:14px;font-weight:900;padding:8px 4px}.labelsRow{display:grid;grid-template-columns:130px 1fr 66px;gap:8px;margin:8px 0 4px;color:#718197;font-size:12px;font-weight:900}.labelsRow div{text-align:center}
.entry{display:grid;grid-template-columns:130px 1fr 66px;gap:8px;align-items:center}.sign{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sign button{height:54px;border:0;border-radius:999px;color:#fff;font-size:36px;font-weight:900}.sign .minus{background:linear-gradient(180deg,#60a5fa,#3b82f6)}.sign .plus{background:linear-gradient(180deg,#ff6b6b,#ef4444)}.sign .off{filter:saturate(.35);opacity:.55}
input{width:100%;min-width:0;height:56px;border-radius:18px;border:2px solid #d9e2ef;background:#fff;text-align:center;font-size:30px;font-weight:900;color:#132238}.apply{height:56px;border:0;border-radius:16px;color:#fff;font-size:14px;font-weight:900;background:linear-gradient(180deg,#41cf7a,var(--green2));padding:0 8px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:8px}.actions button{padding:8px 6px;font-size:11px;background:#fff}.settingsToggle{width:100%;margin-top:7px;padding:7px;font-size:12px;background:#eff5fb}.settings{display:none;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid #e2eaf4}.settings.open{display:grid}.settingsLabel{grid-column:1/-1;text-align:center;font-size:12px;font-weight:800;color:#6f8097}.settings input{height:52px;font-size:22px;border-radius:14px}.settings button{padding:0 14px;font-size:13px;background:#f7fbff}
button{cursor:pointer;touch-action:manipulation}@media(max-width:430px){.quickRow{gap:5px;margin-bottom:6px}.quickBtn{font-size:13px;padding:7px 3px}.player{padding:16px 12px 14px}.hpWrap{gap:8px}.hpLabel,.hpSub{font-size:20px}.hpMain{font-size:78px}.entry{grid-template-columns:110px 1fr 58px}.labelsRow{grid-template-columns:110px 1fr 58px}.sign button{height:50px;font-size:34px}input{height:54px;font-size:28px}.apply{height:54px;font-size:13px;padding:0 5px}.actions button{font-size:10px;padding:7px 4px;min-height:36px}.settings input{height:38px;font-size:16px}.settings button{min-height:38px;font-size:10px}.settingsToggle{min-height:32px;padding:6px 8px;font-size:10px}}
</style></head><body>
<div class="app">
<section class="player top selected" id="panel1"><div class="name">PLAYER 1</div><div class="hpWrap"><div class="hpLabel">HP</div><div class="hpMain" id="hp1">120</div><div class="hpSub" id="max1">/ 120</div></div><div class="bar"><div class="fill" id="bar1"></div></div><div class="status" id="status1">残りHP 120 / 120</div></section>
<section class="center"><div class="currentSel" id="currentSel">選択中：上側</div><div class="quickRow"><button class="quickBtn" data-quick="10">−10</button><button class="quickBtn" data-quick="20">−20</button><button class="quickBtn" data-quick="30">−30</button><button class="quickBtn" data-quick="40">−40</button></div><div class="labelsRow"><div>増減</div><div>数字を入力</div><div></div></div><div class="entry"><div class="sign"><button id="minus" class="minus">−</button><button id="plus" class="plus off">＋</button></div><input id="value" inputmode="numeric" pattern="[0-9]*" placeholder="30"><button id="apply" class="apply">決定</button></div><div class="actions"><button id="undo">↩ 1手戻す</button><button id="resetTarget">↻ 選択側を初期HP</button><button id="resetAll">⟳ 両方を初期HP</button></div><button id="settingsToggle" class="settingsToggle">スタートHP設定</button><div class="settings" id="settings"><div class="settingsLabel">通常は120のままでOK。必要なときだけ変更できます。</div><input id="startHp1" inputmode="numeric" value="120"><input id="startHp2" inputmode="numeric" value="120"><button id="applyStartHp">設定</button></div></section>
<section class="player bottom" id="panel2"><div class="name">PLAYER 2</div><div class="hpWrap"><div class="hpLabel">HP</div><div class="hpMain" id="hp2">120</div><div class="hpSub" id="max2">/ 120</div></div><div class="bar"><div class="fill" id="bar2"></div></div><div class="status" id="status2">残りHP 120 / 120</div></section>
</div>
<script>
(()=>{const KEY="purakoro_hp_redblue_v1";let state={players:{1:{startHp:120,hp:120,history:[]},2:{startHp:120,hp:120,history:[]}},target:1,sign:-1};try{const saved=localStorage.getItem(KEY);if(saved){const p=JSON.parse(saved);if(p?.players?.[1]&&p?.players?.[2])state=p}}catch(e){}const $=id=>document.getElementById(id),value=$("value"),save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function bc(n,p){if(n===1){if(p>50)return"linear-gradient(90deg,#ef4444,#ff6b6b)";if(p>25)return"linear-gradient(90deg,#f59e0b,#fbbf24)";return"linear-gradient(90deg,#dc2626,#fb7185)"}if(p>50)return"linear-gradient(90deg,#3b82f6,#60a5fa)";if(p>25)return"linear-gradient(90deg,#f59e0b,#fbbf24)";return"linear-gradient(90deg,#2563eb,#60a5fa)"}
function rp(n){const p=state.players[n],pc=Math.max(0,Math.min(100,p.startHp?100*p.hp/p.startHp:0));$("hp"+n).textContent=p.hp;$("max"+n).textContent="/ "+p.startHp;$("bar"+n).style.width=pc+"%";$("bar"+n).style.background=bc(n,pc);$("status"+n).innerHTML=p.hp<=0?'<span class="ko">HPが0になりました</span>':"残りHP "+p.hp+" / "+p.startHp}
function rc(){$("panel1").classList.toggle("selected",state.target===1);$("panel2").classList.toggle("selected",state.target===2);$("currentSel").textContent="選択中："+(state.target===1?"上側":"下側");$("minus").classList.toggle("off",state.sign!==-1);$("plus").classList.toggle("off",state.sign!==1)}
function all(){$("startHp1").value=state.players[1].startHp;$("startHp2").value=state.players[2].startHp;rp(1);rp(2);rc()}
function apply(){const n=Math.floor(Number(value.value));if(!n||n<1)return;const p=state.players[state.target];p.history.push(p.hp);p.hp=Math.max(0,p.hp+state.sign*n);value.value="";save();rp(state.target)}
document.querySelectorAll("[data-quick]").forEach(btn=>btn.addEventListener("click",()=>{const dmg=+btn.dataset.quick,p=state.players[state.target];p.history.push(p.hp);p.hp=Math.max(0,p.hp-dmg);save();rp(state.target)}));
$("panel1").onclick=()=>{state.target=1;save();rc()};$("panel2").onclick=()=>{state.target=2;save();rc()};$("minus").onclick=()=>{state.sign=-1;save();rc()};$("plus").onclick=()=>{state.sign=1;save();rc()};$("apply").onclick=apply;value.addEventListener("keydown",e=>{if(e.key==="Enter")apply()});
$("undo").onclick=()=>{const p=state.players[state.target];if(!p.history.length)return;p.hp=p.history.pop();save();rp(state.target)};$("resetTarget").onclick=()=>{const p=state.players[state.target];if(p.hp!==p.startHp)p.history.push(p.hp);p.hp=p.startHp;save();rp(state.target)};$("resetAll").onclick=()=>{if(!confirm("両方のHPをスタートHPに戻しますか？"))return;[1,2].forEach(n=>{state.players[n].hp=state.players[n].startHp;state.players[n].history=[]});save();all()};$("settingsToggle").onclick=()=>$("settings").classList.toggle("open");$("applyStartHp").onclick=()=>{const a=+Math.floor($("startHp1").value),b=+Math.floor($("startHp2").value);if(!a||!b)return;state.players[1]={startHp:a,hp:a,history:[]};state.players[2]={startHp:b,hp:b,history:[]};save();$("settings").classList.remove("open");all()};if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));all()})();
</script></body></html>
