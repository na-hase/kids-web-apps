<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#bfe9ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="どうぶつどこかな？">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../dobutsu-touch/icon-192.png">
<title>どうぶつどこかな？</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#bfe9ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{position:fixed;inset:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit}
.app{position:absolute;inset:0;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:linear-gradient(180deg,#bfe9ff 0%,#eaf9ff 48%,#b8e794 48%,#8fd06f 100%)}
.top{position:relative;z-index:20;min-height:52px;display:flex;align-items:center;justify-content:center}
.home-back{position:absolute;left:0;top:0;width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 4px 12px rgba(55,80,100,.12);color:#5c6670;font-size:34px;line-height:40px;display:grid;place-items:center;padding:0}
.title{font-size:clamp(21px,5.8vw,30px);font-weight:900;color:#53606b}
.status{z-index:15;margin:3px auto 8px;min-width:min(360px,88%);padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.95);box-shadow:0 6px 18px rgba(67,93,112,.13);font-size:clamp(20px,5.5vw,29px);font-weight:900;color:#59636b;text-align:center}
.scene{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:32px;background:linear-gradient(180deg,#a8e4ff 0%,#e7faff 46%,#b7e993 46%,#8fd06f 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.34)}
.sun{position:absolute;right:6%;top:5%;width:58px;height:58px;border-radius:50%;background:#ffd85e;box-shadow:0 0 0 9px rgba(255,226,107,.22)}
.cloud{position:absolute;width:90px;height:27px;border-radius:20px;background:rgba(255,255,255,.8)}
.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud:before{width:40px;height:40px;left:13px;bottom:0}.cloud:after{width:50px;height:50px;right:10px;bottom:0}
.c1{left:6%;top:8%;transform:scale(.72)}.c2{left:46%;top:4%;transform:scale(.52)}
.runner{position:absolute;z-index:8;left:50%;top:25%;transform:translate(-50%,-50%);font-size:clamp(76px,22vw,118px);line-height:1;filter:drop-shadow(0 6px 4px rgba(45,60,50,.16));pointer-events:none;opacity:0}
.runner.ready{opacity:1;animation:hello .45s cubic-bezier(.2,.8,.25,1)}
@keyframes hello{0%{transform:translate(-50%,-50%) scale(.65)}65%{transform:translate(-50%,-56%) scale(1.1)}100%{transform:translate(-50%,-50%) scale(1)}}
.spots{position:absolute;left:3%;right:3%;bottom:5%;height:50%;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:8px 12px}
.spot{position:relative;border:0;background:rgba(255,255,255,.06);border-radius:28px;padding:0;overflow:visible;touch-action:manipulation}
.spot.disabled{pointer-events:none}
.spot.wrong{animation:wrong .34s ease}
@keyframes wrong{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.cover{position:absolute;z-index:10;left:50%;bottom:7%;transform:translateX(-50%);width:76%;height:63%;pointer-events:none}
.hidden-animal{position:absolute;z-index:6;left:50%;bottom:26%;transform:translateX(-50%) translateY(24%) scale(.86);font-size:clamp(58px,18vw,94px);line-height:1;opacity:0;filter:drop-shadow(0 5px 4px rgba(45,60,50,.14));transition:opacity .12s,transform .4s cubic-bezier(.2,.9,.25,1.12)}
.spot.correct{z-index:15}
.spot.correct .hidden-animal{z-index:14;opacity:1;transform:translateX(-50%) translateY(-52%) scale(1.18)}
.tree-trunk{width:38%;height:70%;border-radius:11px;background:#98653d;box-shadow:inset -8px 0 rgba(91,54,32,.12)}
.tree-top{bottom:40%;width:78%;height:56%;border-radius:50%;background:#55ae56;box-shadow:35px 9px 0 #67bf62,-30px 13px 0 #6bc765}
.bush{border-radius:52% 52% 28% 28%;background:#4faa54;box-shadow:32px -14px 0 #62bd62,-31px -10px 0 #69c269,inset 0 -10px rgba(47,123,54,.13)}
.bush:after{content:"";position:absolute;left:18%;top:20%;width:10px;height:10px;border-radius:50%;background:#fff1a0;box-shadow:62px 10px 0 #f7dc55,30px -7px 0 #f8b4bf}
.hay{height:55%;border-radius:20px;background:#e3b340;box-shadow:inset 0 -10px rgba(161,118,27,.12)}
.hay:before,.hay:after{content:"";position:absolute;left:10%;right:10%;height:7px;border-radius:10px;background:#c79128}
.hay:before{top:27%}.hay:after{top:61%}
.box{height:56%;border-radius:9px 9px 20px 20px;background:#c98b56;box-shadow:inset -10px -8px rgba(112,70,39,.12)}
.box:before{content:"";position:absolute;left:0;right:0;top:16%;height:7px;background:#a96e42}
.box:after{content:"";position:absolute;left:46%;top:0;width:8%;height:100%;background:rgba(241,213,163,.45)}
.label{position:absolute;z-index:12;left:50%;bottom:-1px;transform:translateX(-50%);padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.85);font-size:clamp(12px,3.4vw,16px);font-weight:800;color:#687168;white-space:nowrap;pointer-events:none}
.result{position:absolute;z-index:30;left:50%;top:31%;transform:translate(-50%,-50%) scale(.78);padding:13px 22px;border-radius:28px;background:rgba(255,255,255,.97);box-shadow:0 10px 28px rgba(58,86,70,.18);font-size:clamp(27px,8vw,40px);font-weight:900;color:#f1844b;text-align:center;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;white-space:nowrap}
.result.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.spark{position:absolute;z-index:35;left:50%;top:48%;font-size:27px;pointer-events:none;animation:spark .8s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.12) rotate(18deg)}}
@media (orientation:landscape){
 .app{padding-top:max(6px,env(safe-area-inset-top));padding-bottom:max(6px,env(safe-area-inset-bottom))}
 .top{min-height:42px}.home-back{width:40px;height:40px;font-size:30px}.title{font-size:21px}
 .status{position:absolute;z-index:25;left:50%;top:max(5px,env(safe-area-inset-top));transform:translateX(-50%);margin:0;padding:7px 18px;font-size:20px}
 .scene{margin-top:2px}.runner{top:23%;font-size:clamp(70px,22vh,110px)}
 .spots{left:8%;right:8%;bottom:3%;height:58%;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr;gap:12px}
 .cover{width:82%;height:65%}.hidden-animal{font-size:clamp(52px,16vh,82px)}.label{font-size:12px}
 .result{top:25%;font-size:29px}
}
@media (prefers-reduced-motion:reduce){.runner,.spot,.hidden-animal,.spark,.result{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body data-version="3">
<main class="app" oncontextmenu="return false">
  <div class="top">
    <button class="home-back" type="button" aria-label="トップに戻る" onclick="location.href='../'">‹</button>
    <div class="title">どうぶつ どこかな？</div>
  </div>
  <div class="status" id="status">みててね！</div>

  <section class="scene" id="scene" aria-label="どうぶつがかくれた場所をあてる">
    <div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div>
    <div class="runner" id="runner">🐈</div>

    <div class="spots" id="spots">
      <button class="spot disabled" type="button" data-index="0" aria-label="き">
        <span class="hidden-animal"></span>
        <span class="cover tree-trunk"></span><span class="cover tree-top"></span>
        <span class="label">き</span>
      </button>
      <button class="spot disabled" type="button" data-index="1" aria-label="しげみ">
        <span class="hidden-animal"></span><span class="cover bush"></span>
        <span class="label">しげみ</span>
      </button>
      <button class="spot disabled" type="button" data-index="2" aria-label="わら">
        <span class="hidden-animal"></span><span class="cover hay"></span>
        <span class="label">わら</span>
      </button>
      <button class="spot disabled" type="button" data-index="3" aria-label="はこ">
        <span class="hidden-animal"></span><span class="cover box"></span>
        <span class="label">はこ</span>
      </button>
    </div>

    <div class="result" id="result">みつけた！</div>
  </section>
</main>

<script>
(function(){
  var animals=[
    {name:"いぬ",icon:"🐕",sound:"dog.wav"},
    {name:"ねこ",icon:"🐈",sound:"cat.wav"},
    {name:"ぞう",icon:"🐘",sound:"elephant.mp3"},
    {name:"らいおん",icon:"🦁",sound:"lion.wav"},
    {name:"さる",icon:"🐒",sound:"monkey.wav"},
    {name:"うし",icon:"🐄",sound:"cow.wav"},
    {name:"とり",icon:"🐤",sound:"bird.wav"}
  ];
  var spots=Array.prototype.slice.call(document.querySelectorAll(".spot"));
  var runner=document.getElementById("runner");
  var status=document.getElementById("status");
  var result=document.getElementById("result");
  var scene=document.getElementById("scene");
  var current=null;
  var targetIndex=0;
  var lastAnimal=-1;
  var lastSpot=-1;
  var phase="showing";
  var soundCache={};

  function speak(text){
    try{
      if(!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(text);
      u.lang="ja-JP";u.rate=.83;u.pitch=1.12;u.volume=1;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function playCry(animal){
    try{
      var src="../dobutsu-touch/audio/"+animal.sound;
      var a=soundCache[animal.name]||(soundCache[animal.name]=new Audio(src));
      a.pause();a.currentTime=0;a.volume=1;
      var p=a.play();if(p&&p.catch)p.catch(function(){});
    }catch(e){}
  }

  function sparkleAt(spot){
    var sr=scene.getBoundingClientRect();
    var br=spot.getBoundingClientRect();
    var x=br.left+br.width/2-sr.left;
    var y=br.top+br.height*.35-sr.top;
    var pts=[[-55,-20],[55,-25],[-40,40],[44,38],[0,-55]];
    var chars=["★","✦","●","★","✦"];
    var colors=["#ffd04f","#ff8ea1","#70c9ff","#8fd56d","#ba91ef"];
    pts.forEach(function(p,i){
      var s=document.createElement("span");s.className="spark";s.textContent=chars[i];
      s.style.left=x+"px";s.style.top=y+"px";
      s.style.setProperty("--x",p[0]+"px");s.style.setProperty("--y",p[1]+"px");s.style.color=colors[i];
      scene.appendChild(s);setTimeout(function(){s.remove();},850);
    });
  }

  function chooseDifferent(max,last){
    var n;
    do{n=Math.floor(Math.random()*max);}while(n===last&&max>1);
    return n;
  }

  function resetSpots(){
    spots.forEach(function(spot){
      spot.classList.remove("correct","wrong");
      spot.classList.add("disabled");
      spot.querySelector(".hidden-animal").textContent="";
    });
  }

  function startRound(){
    phase="showing";
    resetSpots();
    result.classList.remove("show");

    var ai=chooseDifferent(animals.length,lastAnimal);
    lastAnimal=ai;current=animals[ai];
    targetIndex=chooseDifferent(spots.length,lastSpot);
    lastSpot=targetIndex;

    runner.textContent=current.icon;
    runner.style.transition="none";
    runner.style.transform="translate(-50%,-50%)";
    runner.style.opacity="1";
    runner.classList.remove("ready");void runner.offsetWidth;runner.classList.add("ready");
    status.textContent=current.name+"が いるよ！";

    setTimeout(function(){
      moveToHide();
    },850);
  }

  function moveToHide(){
    var sceneRect=scene.getBoundingClientRect();
    var spotRect=spots[targetIndex].getBoundingClientRect();
    var startX=sceneRect.width/2;
    var startY=sceneRect.height*.25;
    var endX=spotRect.left+spotRect.width/2-sceneRect.left;
    var endY=spotRect.top+spotRect.height*.53-sceneRect.top;
    var dx=endX-startX;
    var dy=endY-startY;

    status.textContent="どこに かくれるかな？";
    runner.style.transition="transform 1.05s cubic-bezier(.35,.05,.25,1), opacity .25s linear .82s";
    runner.style.transform="translate(calc(-50% + "+dx+"px),calc(-50% + "+dy+"px)) scale(.62)";
    runner.style.opacity="0";

    setTimeout(function(){
      phase="guess";
      runner.classList.remove("ready");
      spots.forEach(function(s){s.classList.remove("disabled");});
      status.textContent="どこに かくれた？";
    },1120);
  }

  function wrong(spot){
    spot.classList.remove("wrong");void spot.offsetWidth;spot.classList.add("wrong");
    status.textContent="もういちど！";
    speak("もういちど");
    setTimeout(function(){
      spot.classList.remove("wrong");
      if(phase==="guess")status.textContent="どこに かくれた？";
    },650);
  }

  function correct(spot){
    phase="result";
    spots.forEach(function(s){s.classList.add("disabled");});
    var hidden=spot.querySelector(".hidden-animal");
    hidden.textContent=current.icon;
    spot.classList.add("correct");
    result.textContent="みつけた！ "+current.name+"！";
    result.classList.add("show");
    status.textContent="せいかい！";
    sparkleAt(spot);
    playCry(current);
    setTimeout(function(){speak(current.name);},260);
    setTimeout(startRound,2100);
  }

  spots.forEach(function(spot){
    spot.addEventListener("pointerdown",function(e){
      e.preventDefault();
      if(phase!=="guess")return;
      if(Number(spot.dataset.index)===targetIndex)correct(spot);else wrong(spot);
    },{passive:false});
  });

  document.addEventListener("touchmove",function(e){e.preventDefault();},{passive:false});
  document.addEventListener("gesturestart",function(e){e.preventDefault();},{passive:false});
  setTimeout(startRound,220);
})();
</script>
</body>
</html>
