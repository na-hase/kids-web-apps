<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#bfe9ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="どうぶつどこかな？">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../dobutsu-touch/icon-192.png">
<title>どうぶつどこかな？</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#bfe9ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{position:fixed;inset:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit}
.app{position:absolute;inset:0;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:linear-gradient(180deg,#bfe9ff 0%,#eaf9ff 48%,#b8e794 48%,#8fd06f 100%)}
.top{position:relative;z-index:10;min-height:52px;display:flex;align-items:center;justify-content:center}
.home-back{position:absolute;left:0;top:0;width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 4px 12px rgba(55,80,100,.12);color:#5c6670;font-size:34px;line-height:40px;display:grid;place-items:center;padding:0}
.title{font-size:clamp(21px,5.8vw,30px);font-weight:900;color:#53606b}
.question{z-index:8;margin:4px auto 8px;padding:11px 22px;border-radius:999px;background:rgba(255,255,255,.94);box-shadow:0 7px 20px rgba(67,93,112,.13);font-size:clamp(21px,5.8vw,30px);font-weight:900;color:#59636b;text-align:center}
.scene{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:32px;background:linear-gradient(180deg,#a8e4ff 0%,#e7faff 52%,#b7e993 52%,#8fd06f 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.34)}
.sun{position:absolute;right:7%;top:6%;width:62px;height:62px;border-radius:50%;background:#ffd85e;box-shadow:0 0 0 10px rgba(255,226,107,.22)}
.cloud{position:absolute;width:92px;height:28px;border-radius:20px;background:rgba(255,255,255,.8)}
.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud:before{width:42px;height:42px;left:13px;bottom:0}.cloud:after{width:52px;height:52px;right:10px;bottom:0}
.c1{left:7%;top:9%;transform:scale(.78)}.c2{left:45%;top:5%;transform:scale(.54)}
.hill{position:absolute;left:-15%;right:-15%;bottom:-25%;height:52%;border-radius:50%;background:rgba(77,162,60,.18)}
.hide-button{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:min(82vw,410px);height:min(58vh,440px);border:0;background:transparent;padding:0;touch-action:manipulation}
.animal{position:absolute;z-index:2;left:50%;bottom:25%;transform:translateX(-50%) translateY(18%) scale(.92);font-size:clamp(105px,31vw,175px);line-height:1;filter:drop-shadow(0 7px 5px rgba(45,60,50,.16));transition:transform .38s cubic-bezier(.2,.9,.25,1.15)}
.cover{position:absolute;z-index:3;left:50%;bottom:4%;transform:translateX(-50%);width:78%;height:48%}
.hide-button.revealed .animal{z-index:5;transform:translateX(-50%) translateY(-46%) scale(1.12)}
.bush{border-radius:52% 52% 30% 30%;background:#4faa54;box-shadow:52px -20px 0 #62bd62,-52px -14px 0 #69c269,inset 0 -14px rgba(47,123,54,.13)}
.bush:after{content:"";position:absolute;left:18%;top:18%;width:13px;height:13px;border-radius:50%;background:#fff1a0;box-shadow:95px 16px 0 #f7dc55,38px -8px 0 #f8b4bf}
.hay{border-radius:28px;background:#e3b340;box-shadow:inset 0 -13px rgba(161,118,27,.12)}
.hay:before,.hay:after{content:"";position:absolute;left:11%;right:11%;height:9px;border-radius:10px;background:#c79128}
.hay:before{top:27%}.hay:after{top:62%}
.box{height:44%;border-radius:10px 10px 24px 24px;background:#c98b56;box-shadow:inset -14px -10px rgba(112,70,39,.12)}
.box:before{content:"";position:absolute;left:0;right:0;top:16%;height:8px;background:#a96e42}
.box:after{content:"";position:absolute;left:46%;top:0;width:8%;height:100%;background:rgba(241,213,163,.45)}
.name-card{position:absolute;z-index:12;left:50%;top:24%;transform:translate(-50%,-50%) scale(.75);min-width:190px;padding:13px 23px;border-radius:28px;background:rgba(255,255,255,.97);box-shadow:0 10px 28px rgba(58,86,70,.18);font-size:clamp(27px,8vw,42px);font-weight:900;color:#f1844b;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.name-card.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.hint{position:absolute;z-index:9;left:50%;bottom:18px;transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.87);font-size:clamp(16px,4.5vw,21px);font-weight:800;color:#67736b;white-space:nowrap;box-shadow:0 5px 15px rgba(60,85,70,.1)}
.spark{position:absolute;z-index:20;left:50%;top:45%;font-size:28px;pointer-events:none;animation:spark .8s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.15) rotate(18deg)}}
@media (orientation:landscape){
 .app{padding-top:max(6px,env(safe-area-inset-top));padding-bottom:max(6px,env(safe-area-inset-bottom))}
 .top{min-height:42px}.home-back{width:40px;height:40px;font-size:30px}.title{font-size:21px}
 .question{position:absolute;z-index:20;left:50%;top:max(5px,env(safe-area-inset-top));transform:translateX(-50%);margin:0;padding:7px 19px;font-size:21px}
 .scene{margin-top:2px}.hide-button{width:min(48vw,430px);height:82%}
 .animal{font-size:clamp(88px,24vh,145px)}.hint{bottom:10px;font-size:16px}.name-card{top:20%;font-size:30px}
}
@media (prefers-reduced-motion:reduce){.animal,.name-card,.spark{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body data-version="2">
<main class="app" oncontextmenu="return false">
  <div class="top">
    <button class="home-back" type="button" aria-label="トップに戻る" onclick="location.href='../'">‹</button>
    <div class="title">どうぶつ どこかな？</div>
  </div>
  <div class="question">だれが かくれてるかな？</div>

  <section class="scene" id="scene" aria-label="かくれているどうぶつをタッチする">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="hill"></div>

    <button class="hide-button" id="hideButton" type="button" aria-label="かくれているどうぶつ">
      <span class="animal" id="animal">🐈</span>
      <span class="cover bush" id="cover"></span>
    </button>

    <div class="name-card" id="nameCard">ねこ！</div>
    <div class="hint" id="hint">どうぶつを タッチしてね</div>
  </section>
</main>

<script>
(function(){
  var animals=[
    {name:"いぬ",icon:"🐕"},
    {name:"ねこ",icon:"🐈"},
    {name:"うさぎ",icon:"🐇"},
    {name:"ぞう",icon:"🐘"},
    {name:"らいおん",icon:"🦁"},
    {name:"さる",icon:"🐒"},
    {name:"うし",icon:"🐄"},
    {name:"とり",icon:"🐤"}
  ];
  var covers=["bush","hay","box"];
  var hideButton=document.getElementById("hideButton");
  var animalEl=document.getElementById("animal");
  var coverEl=document.getElementById("cover");
  var nameCard=document.getElementById("nameCard");
  var hint=document.getElementById("hint");
  var scene=document.getElementById("scene");
  var current=null;
  var lastIndex=-1;
  var locked=false;
  var audioCtx=null;

  function ensureAudio(){
    try{
      if(!audioCtx){
        var C=window.AudioContext||window.webkitAudioContext;
        if(C) audioCtx=new C();
      }
      if(audioCtx&&audioCtx.state==="suspended") audioCtx.resume();
    }catch(e){}
  }

  function speak(text){
    try{
      if(!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(text);
      u.lang="ja-JP";
      u.rate=.82;
      u.pitch=1.12;
      u.volume=1;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function chime(){
    try{
      ensureAudio();
      if(!audioCtx) return;
      var now=audioCtx.currentTime;
      [523.25,659.25,783.99].forEach(function(f,i){
        var o=audioCtx.createOscillator();
        var g=audioCtx.createGain();
        o.type="sine";o.frequency.value=f;
        g.gain.setValueAtTime(.0001,now+i*.075);
        g.gain.exponentialRampToValueAtTime(.13,now+i*.075+.015);
        g.gain.exponentialRampToValueAtTime(.0001,now+i*.075+.23);
        o.connect(g);g.connect(audioCtx.destination);
        o.start(now+i*.075);o.stop(now+i*.075+.25);
      });
    }catch(e){}
  }

  function sparkle(){
    var pts=[[-80,-35],[80,-30],[-60,42],[64,44],[0,-75]];
    var chars=["★","✦","●","★","✦"];
    var colors=["#ffd04f","#ff8ea1","#70c9ff","#8fd56d","#ba91ef"];
    pts.forEach(function(p,i){
      var s=document.createElement("span");
      s.className="spark";
      s.textContent=chars[i];
      s.style.setProperty("--x",p[0]+"px");
      s.style.setProperty("--y",p[1]+"px");
      s.style.color=colors[i];
      scene.appendChild(s);
      setTimeout(function(){s.remove();},850);
    });
  }

  function nextRound(){
    locked=false;
    hideButton.classList.remove("revealed");
    nameCard.classList.remove("show");
    hint.textContent="どうぶつを タッチしてね";

    var idx;
    do{idx=Math.floor(Math.random()*animals.length);}while(idx===lastIndex&&animals.length>1);
    lastIndex=idx;
    current=animals[idx];

    animalEl.textContent=current.icon;
    nameCard.textContent=current.name+"！";
    hideButton.setAttribute("aria-label",current.name+"がかくれている");

    var coverName=covers[Math.floor(Math.random()*covers.length)];
    coverEl.className="cover "+coverName;
  }

  function reveal(){
    if(locked) return;
    locked=true;
    ensureAudio();
    hideButton.classList.add("revealed");
    nameCard.classList.add("show");
    hint.textContent="みつけた！";
    chime();
    sparkle();
    speak(current.name);
    setTimeout(nextRound,1500);
  }

  hideButton.addEventListener("pointerdown",function(e){
    e.preventDefault();
    reveal();
  },{passive:false});

  document.addEventListener("touchmove",function(e){e.preventDefault();},{passive:false});
  document.addEventListener("gesturestart",function(e){e.preventDefault();},{passive:false});

  nextRound();
})();
</script>
</body>
</html>
