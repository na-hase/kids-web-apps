<script>
const animals=[
  {idx:0,name:'いぬ',color:'c1'},
  {idx:1,name:'ねこ',color:'c2'},
  {idx:2,name:'うさぎ',color:'c3'},
  {idx:3,name:'ぞう',color:'c4'},
  {idx:4,name:'らいおん',color:'c5'},
  {idx:5,name:'さる',color:'c6'},
  {idx:6,name:'うし',color:'c7'},
  {idx:7,name:'とり',color:'c8'}
];
const grid=document.getElementById('grid');
let lastTap=0;
const cries={'いぬ':'わんわん','ねこ':'にゃー','うさぎ':'ぴょんぴょん','ぞう':'ぱおーん','らいおん':'がおー','さる':'うきうき','うし':'もー','とり':'ぴよぴよ'};
function speak(name){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(name);
    u.lang='ja-JP';
    u.rate=.82;
    u.pitch=1.15;
    u.volume=.9;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function tinyTone(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    const c=new C();
    const o=c.createOscillator();
    const g=c.createGain();
    o.type='sine';o.frequency.value=520;
    g.gain.setValueAtTime(.0001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.02,c.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.12);
    o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.13);
    o.onended=()=>c.close();
  }catch(e){}
}
function sparkle(btn){
  const chars=['★','✦','●'];
  const pts=[[-52,-42],[55,-32],[-10,-62]];
  pts.forEach((p,i)=>{
    const s=document.createElement('span');
    s.className='spark';s.textContent=chars[i%chars.length];
    s.style.setProperty('--x',p[0]+'px');s.style.setProperty('--y',p[1]+'px');
    s.style.color=['#ff9fb0','#7bc8ff','#f3c94f'][i];
    btn.appendChild(s);setTimeout(()=>s.remove(),750);
  });
}
animals.forEach(a=>{
  const b=document.createElement('button');
  b.className=`animal ${a.color}`;
  b.type='button';
  b.setAttribute('aria-label',a.name);
  b.innerHTML=`<div class="emoji"><div class="sprite s${a.idx}" role="img" aria-label="${a.name}"></div></div><div class="name">${a.name}</div><div class="sound-label">${cries[a.name]||''}</div>`;
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const now=Date.now();
    b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
    sparkle(b);
    if(now-lastTap>120){tinyTone();lastTap=now;}
    const label=b.querySelector('.sound-label');
    if(label){label.classList.remove('show');void label.offsetWidth;label.classList.add('show');setTimeout(()=>label.classList.remove('show'),800);}
    speak(a.name);
  },{passive:false});
  grid.appendChild(b);
});

document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{}));}
</script>
