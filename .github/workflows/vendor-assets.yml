name: Vendor Railway assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vendor-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download static assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/dobutsu-touch/audio site/ponpon-touch
          curl -fsSL --retry 4 "https://dobutsu-touch-production.up.railway.app/icon-192.png" -o site/dobutsu-touch/icon-192.png
          curl -fsSL --retry 4 "https://dobutsu-touch-production.up.railway.app/icon-512.png" -o site/dobutsu-touch/icon-512.png
          curl -fsSL --retry 4 "https://ponpon-touch-production.up.railway.app/icon-192.png" -o site/ponpon-touch/icon-192.png
          curl -fsSL --retry 4 "https://ponpon-touch-production.up.railway.app/icon-512.png" -o site/ponpon-touch/icon-512.png
          curl -fsSL --retry 4 "https://dobutsu-touch-production.up.railway.app/audio/dog.wav" -o site/dobutsu-touch/audio/dog.wav
          curl -fsSL --retry 4 "https://dobutsu-touch-production.up.railway.app/audio/cat.wav" -o site/dobutsu-touch/audio/cat.wav
          curl -fsSL --retry 4 "https://dobutsu-touch-production.up.railway.app/audio/cow.wav" -o site/dobutsu-touch/audio/cow.wav
          curl -fsSL --retry 4 "https://dobutsu-touch-production.up.railway.app/audio/bird.wav" -o site/dobutsu-touch/audio/bird.wav
          curl -fsSL --retry 4 "https://dobutsu-touch-production.up.railway.app/audio/elephant.mp3" -o site/dobutsu-touch/audio/elephant.mp3
          curl -fsSL --retry 4 "https://dobutsu-touch-production.up.railway.app/audio/monkey.wav" -o site/dobutsu-touch/audio/monkey.wav
          curl -fsSL --retry 4 "https://dobutsu-touch-production.up.railway.app/audio/lion.wav" -o site/dobutsu-touch/audio/lion.wav
      - name: Commit vendored assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/dobutsu-touch site/ponpon-touch
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Vendor static assets from Railway"
            git push
          fi
